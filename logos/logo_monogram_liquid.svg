<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E93" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#FF2E93" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#07070A" stop-opacity="0" />
    </radialGradient>
    <filter id="glassBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="800" rx="40" fill="#07070A" />
  <circle cx="400" cy="360" r="300" fill="url(#ambientGlow)" />
  
  <!-- Subtle Frosted Border -->
  <rect x="20" y="20" width="760" height="760" rx="30" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Monogram Centerpiece: FDFS Dynamic Motion Loop -->
  <g transform="translate(400, 340)">
    <!-- Liquid Motion Wave Behind -->
    <path d="M-180,60 C-120,-80 0,-140 120,-60 C180,-20 220,60 140,110 C80,150 -40,120 -100,50" 
          fill="none" stroke="url(#liquidGrad)" stroke-width="18" stroke-linecap="round" opacity="0.4" filter="url(#glassBlur)" />
    
    <!-- Ribbon Loop Dancer Arc -->
    <path d="M-160,80 C-100,-100 20,-160 140,-80 C200,-40 210,50 130,100 C60,140 -60,110 -120,40" 
          fill="none" stroke="url(#liquidGrad)" stroke-width="12" stroke-linecap="round" />

    <!-- Stylized F Crest Wing (Left) -->
    <path d="M-130,80 L-130,-120 L-40,-120 M-130,-30 L-60,-30" 
          fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Interlocking D & Ribbon Wave -->
    <path d="M-40,80 L-40,-120 C40,-120 70,-70 70,-20 C70,40 30,80 -40,80 Z" 
          fill="none" stroke="url(#goldAccent)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />

    <!-- S Dynamic Lower Flourish -->
    <path d="M120,-30 C120,-80 80,-110 30,-110 C-30,-110 -40,-60 20,-20 C80,20 80,80 20,80 C-40,80 -60,30 -60,10" 
          fill="none" stroke="url(#liquidGrad)" stroke-width="13" stroke-linecap="round" />

    <!-- Spark / Dynamic Energy Stars -->
    <polygon points="150,-130 156,-114 172,-108 156,-102 150,-86 144,-102 128,-108 144,-114" fill="#FDE047" />
    <polygon points="-160,-140 -155,-128 -143,-123 -155,-118 -160,-106 -165,-118 -177,-123 -165,-128" fill="#00F0FF" />
  </g>

  <!-- Typography Block -->
  <text x="400" y="550" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif" font-weight="900" font-size="64" letter-spacing="12" fill="#FFFFFF">
    FDFS
  </text>
  
  <text x="400" y="605" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="700" font-size="20" letter-spacing="6" fill="url(#goldAccent)">
    FLAWLESS DANCE &amp; FITNESS STUDIO
  </text>

  <line x1="260" y1="630" x2="540" y2="630" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />

  <text x="400" y="665" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="500" font-size="14" letter-spacing="5" fill="#94A3B8">
    GHANSOLI · NAVI MUMBAI · ESTD 2018
  </text>
  
  <text x="400" y="700" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="13" letter-spacing="3" fill="#FF2E93">
    DANCE · ZUMBA · YOGA · FITNESS
  </text>
</svg>
